<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particle Sphere — 3D Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .ui-title {
      color: rgba(255,255,255,0.85);
      font-size: 17px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .ui-hint {
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      text-align: right;
      line-height: 1.7;
    }

    #back {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.35);
      font-size: 13px;
      text-decoration: none;
      pointer-events: all;
      letter-spacing: 1px;
      transition: color 0.25s;
      white-space: nowrap;
    }
    #back:hover { color: rgba(255,255,255,0.85); }
  </style>
</head>
<body>

<div id="ui">
  <div class="ui-title">Particle Sphere</div>
  <div class="ui-hint">Drag to rotate · Scroll to zoom</div>
</div>
<a id="back" href="index.html">← Back to VICAR Viewer</a>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Renderer / Camera / Scene ────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.z = 18;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping  = true;
controls.dampingFactor  = 0.06;
controls.minDistance    = 8;
controls.maxDistance    = 50;

// ─── Color palette ────────────────────────────────────────────
const palette = [
  new THREE.Color(0x00ffff),   // cyan
  new THREE.Color(0xff1493),   // deep pink
  new THREE.Color(0x7b2fff),   // violet
  new THREE.Color(0xff69b4),   // hot pink
  new THREE.Color(0x00bfff),   // sky blue
  new THREE.Color(0x39ff14),   // neon green
];

// ─── Particle sphere ──────────────────────────────────────────
// Fibonacci sphere distribution gives even coverage with no poles artifact
function buildParticleSphere(radius, count) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const golden = Math.PI * (1 + Math.sqrt(5));

  for (let i = 0; i < count; i++) {
    const phi   = Math.acos(1 - 2 * (i + 0.5) / count);
    const theta = golden * i;
    const r     = radius * (0.965 + Math.random() * 0.07);

    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);

    const c      = palette[i % palette.length];
    const bright = 0.65 + Math.random() * 0.7;
    col[i*3]   = Math.min(c.r * bright, 1);
    col[i*3+1] = Math.min(c.g * bright, 1);
    col[i*3+2] = Math.min(c.b * bright, 1);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  return new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.058,
    vertexColors: true,
    transparent: true,
    opacity: 0.92,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  }));
}

// ─── Single orbit ring with layered glow ──────────────────────
function buildOrbitRing(radius, color, segments = 320) {
  const rawPts = new Float32Array((segments + 1) * 3);
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    rawPts[i*3]   = Math.cos(a) * radius;
    rawPts[i*3+1] = Math.sin(a) * radius;
    rawPts[i*3+2] = 0;
  }

  const group = new THREE.Group();

  // Three concentric passes: outer halo → mid glow → bright core
  const layers = [
    { scale: 1.014, opacity: 0.18 },
    { scale: 1.005, opacity: 0.42 },
    { scale: 1.000, opacity: 0.90 },
  ];

  layers.forEach(({ scale, opacity }) => {
    const pts = rawPts.slice();
    for (let i = 0; i < pts.length; i++) {
      if (i % 3 !== 2) pts[i] *= scale; // scale x/y only
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
    group.add(new THREE.LineLoop(geo, new THREE.LineBasicMaterial({
      color,
      transparent: true,
      opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    })));
  });

  // Sparse sparkle dots riding the ring path
  const sparkCount = 60;
  const sparkPos   = new Float32Array(sparkCount * 3);
  for (let k = 0; k < sparkCount; k++) {
    const a = (k / sparkCount) * Math.PI * 2;
    const j = (Math.random() - 0.5) * 0.12;
    sparkPos[k*3]   = Math.cos(a) * (radius + j);
    sparkPos[k*3+1] = Math.sin(a) * (radius + j);
    sparkPos[k*3+2] = (Math.random() - 0.5) * 0.12;
  }
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
  group.add(new THREE.Points(sparkGeo, new THREE.PointsMaterial({
    size: 0.09,
    color,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  })));

  return group;
}

// ─── All six orbit rings spread at distinct inclinations ──────
function buildAllRings(radius, count) {
  const group = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const color = palette[i % palette.length];
    const ring  = buildOrbitRing(radius, color);

    ring.rotation.x = (i / count) * Math.PI;
    ring.rotation.y = (i / count) * Math.PI * 0.8 + 0.25;

    // Alternating rotation direction, random speed variation
    ring.userData.speed = 0.0022 + Math.random() * 0.0028;
    ring.userData.dir   = i % 2 === 0 ? 1 : -1;
    group.add(ring);
  }
  return group;
}

// ─── Halo dust cloud outside the sphere ───────────────────────
function buildHaloDust(innerR, outerR, count) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = innerR + Math.random() * (outerR - innerR);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    const c = palette[Math.floor(Math.random() * palette.length)];
    const t = 0.15 + Math.random() * 0.35;
    col[i*3]   = c.r * t;
    col[i*3+1] = c.g * t;
    col[i*3+2] = c.b * t;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.042,
    vertexColors: true,
    transparent: true,
    opacity: 0.55,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  }));
}

// ─── Assemble scene ───────────────────────────────────────────
const sphere = buildParticleSphere(5, 12000);
scene.add(sphere);

const rings  = buildAllRings(5.8, 6);
scene.add(rings);

const halo   = buildHaloDust(5.6, 9, 2500);
scene.add(halo);

// ─── Animation loop ───────────────────────────────────────────
let time = 0;
(function animate() {
  requestAnimationFrame(animate);
  time += 0.002;

  controls.update();

  // Gentle sphere drift
  sphere.rotation.y  = time * 0.22;
  sphere.rotation.x  = Math.sin(time * 0.13) * 0.12;

  // Each ring spins on its own local Z axis
  rings.children.forEach(ring => {
    ring.rotation.z += ring.userData.speed * ring.userData.dir;
  });

  // Halo counter-rotates slowly for depth
  halo.rotation.y = -time * 0.04;

  renderer.render(scene, camera);
})();

// ─── Resize ───────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
